<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion</title>
<style>
  html, body { margin: 0; height: 100%; }
  .video-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #000;
  }
  .video-container video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
</style>
</head>
<body>
  <div class="video-container">
    <video src="https://nasdaqbrandstudio.github.io/files/motion.mp4"
           autoplay muted loop playsinline></video>
  </div>
</body>
</html>
