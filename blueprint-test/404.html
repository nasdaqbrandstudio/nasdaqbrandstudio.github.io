<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nasdaq</title>
<meta name="robots" content="noindex, nofollow">

<script>
(function () {
  'use strict';

  // Runs in <head>, before anything paints. Everything below the script is only
  // reachable with JavaScript off.
  //
  // Language comes from ?lang= and nothing else. render.js validates it against
  // languages.json, discards anything unlisted and falls back to the default,
  // so there is no list to keep in step here.

  // Where the page lives. The path differs per environment, so each one gets an
  // entry; the ones that do not apply simply never match. Longest first.
  var SITE = [
    '/campaign/global-indexes/blueprint-of-tomorrow/',
    '/blueprint-of-tomorrow/',
    '/blueprint-test/',
    '/blueprint/'
  ];

  var path = location.pathname;
  var root = '';
  for (var i = 0; i < SITE.length; i++) {
    if (path.indexOf(SITE[i]) === 0) { root = SITE[i]; break; }
  }
  if (!root) return;

  var lang = /[?&]lang=([a-z]{2,3})\b/i.exec(location.search || '');
  var target = root + (lang ? '?lang=' + lang[1].toLowerCase() : '') + (location.hash || '');

  // Already here? Redirecting would loop.
  if (target !== path && target !== path + (location.search || '') + (location.hash || '')) {
    // replace() rather than assign() so Back does not return to this page.
    location.replace(target);
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #08062a; color: #fff;
    font-family: Inter, Arial, Helvetica, sans-serif;
    font-size: .9375rem; text-align: center; padding: 2rem;
  }
  a { color: #0092bc; }
</style>
</head>
<body>
  <p>Continue to <a href="/campaign/global-indexes/blueprint-of-tomorrow/">Blueprint of Tomorrow</a></p>
</body>
</html>
