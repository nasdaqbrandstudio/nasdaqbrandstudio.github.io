<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nasdaq</title>

<!-- Don't index this page. The HTTP status stays 404 -- the server answers
     before any of this runs, and that is correct: it tells crawlers the URL is
     gone so they stop asking for it. The status code and what the reader sees
     are separate concerns. -->
<meta name="robots" content="noindex, nofollow">

<script>
(function () {
  'use strict';

  // Runs in <head>, before the body paints, so a reader who is about to be
  // redirected never sees this page. The markup below renders only when there
  // is nowhere to send them, or when JavaScript is off.
  //
  // ---------------------------------------------------------------------
  // Language is carried through, and it does NOT need languages.json.
  //
  // This page makes a best guess at the language and passes it along as
  // ?lang=. render.js is the one that validates: it checks the code against
  // languages.json, discards anything unlisted, falls back to the default,
  // and strips the parameter back out of the URL. So a guess that turns out
  // to be wrong costs nothing.
  //
  // That is what makes this scalable. Add a language to languages.json and it
  // works here immediately -- there is no list in this file to update, and no
  // fetch to wait on before redirecting.
  // ---------------------------------------------------------------------

  var STORE = 'bp-lang';   // must match LANG_STORE in render.js

  // Two letters, or three, optionally followed by a region or script subtag.
  // Matches ja, ja-jp, ko-kr, zh-hans, pt-br. Does not match typo, deep,
  // index, or anything else that is plainly not a language code.
  var CODE = /^([a-z]{2,3})(?:[-_][a-z0-9]{2,4})?$/i;

  function codeFrom(s) {
    var m = CODE.exec(String(s || ''));
    return m ? m[1].toLowerCase() : '';
  }

  var path = location.pathname;
  var search = location.search || '';
  var hash = location.hash || '';

  // --- 1. language -----------------------------------------------------
  var lang = '';

  // An explicit ?lang= always wins.
  var q = /[?&]lang=([^&]*)/i.exec(search);
  if (q) lang = codeFrom(decodeURIComponent(q[1]));

  // Otherwise look at the URL itself: the filename first (ja-jp.html), then
  // any path segment (/blueprint-of-tomorrow/ja/gone).
  if (!lang) {
    var parts = path.split('/').filter(Boolean);
    var last = parts.length ? parts[parts.length - 1] : '';
    lang = codeFrom(last.replace(/\.[a-z0-9]+$/i, ''));
    for (var i = parts.length - 1; i >= 0 && !lang; i--) {
      lang = codeFrom(parts[i]);
    }
  }

  // Otherwise whatever they last chose from the language menu.
  if (!lang) {
    try { lang = codeFrom(localStorage.getItem(STORE)); } catch (e) {}
  }

  // Otherwise the browser. render.js discards it if it is not on offer.
  if (!lang) {
    try {
      var nav = (navigator.languages && navigator.languages.length)
        ? navigator.languages : [navigator.language || ''];
      for (var j = 0; j < nav.length && !lang; j++) lang = codeFrom(nav[j]);
    } catch (e) {}
  }

  // --- 2. where to send them -------------------------------------------
  // Paths that actually serve a page. No server works this out on its own,
  // so it has to be stated. Longest first; first prefix match wins.
  //
  // /campaign/global-indexes/ is deliberately absent -- it has no index page,
  // so anything under it falls through to the site root rather than landing
  // on a second 404. This list is the only thing in this file that needs
  // touching when the site grows.
  var ROOTS = [
    '/campaign/global-indexes/blueprint-of-tomorrow/',
    '/'
  ];

  var root = '';
  for (var k = 0; k < ROOTS.length; k++) {
    if (path.indexOf(ROOTS[k]) === 0) { root = ROOTS[k]; break; }
  }

  if (root) {
    var target = root;

    // The site root is not this site, so it takes neither the language nor
    // the anchor -- both would be meaningless there.
    if (root !== '/') {
      if (lang) target += '?lang=' + encodeURIComponent(lang);
      if (hash) target += hash;
    }

    // Already here? Redirecting would loop.
    if (target !== path && target !== path + search + hash) {
      // replace() rather than assign() so Back does not return to this page.
      location.replace(target);
    }
  }
})();
</script>

<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #08062a; color: #fff;
    font-family: Inter, Arial, Helvetica, sans-serif;
    text-align: center; padding: 2rem;
  }
  .wrap { max-width: 32rem; }
  h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 .75rem; }
  p  { font-size: .9375rem; line-height: 1.6; color: #c9c9d6; margin: 0 0 1.5rem; }
  .go {
    display: inline-block; padding: .75rem 1.25rem; border-radius: .25rem;
    background: #0092bc; color: #fff; text-decoration: none; font-size: .875rem;
  }
</style>
</head>
<body>
  <!-- Reached only when nothing matched, or with JavaScript off. Either way the
       reader is staying here, so the error wording is the right wording. -->
  <div class="wrap">
    <h1>We couldn't find that page</h1>
    <p>The address may be out of date, or the page may have moved.</p>
    <a class="go" href="/">Go to Nasdaq.com</a>
  </div>
</body>
</html>
