<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Korean | Blueprint of Tomorrow</title>

<!-- Redirect stub. This filename was the Korean page before the rebuild; the
     content now lives on index.html and is selected with ?lang=ko. The file
     stays so old links, decks and search results keep working.

     canonical is what stops this reading as duplicate content: a meta refresh
     returns HTTP 200 rather than a 301, so canonical is doing the job a server
     redirect would otherwise do. -->
<link rel="canonical" href="./?lang=ko">
<meta name="robots" content="noindex, follow">

<script>
(function () {
  // Runs first because a meta refresh cannot carry a #anchor.
  // An explicit ?lang= in the URL beats the one this filename implies.
  var search = /[?&]lang=/.test(location.search) ? location.search : '?lang=ko';
  location.replace('./' + search + (location.hash || ''));
})();
</script>

<!-- Fallback for JavaScript off. -->
<meta http-equiv="refresh" content="0; url=./?lang=ko">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #08062a; color: #fff;
    font-family: Inter, Arial, Helvetica, sans-serif;
    font-size: .9375rem; text-align: center; padding: 2rem;
  }
  a { color: #0092bc; }
</style>
</head>

</body>
