<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Korean | Blueprint of Tomorrow</title>

<!-- Redirect stub. This filename was the Korean page before the rebuild; the
     content now lives on index.html and is selected with ?lang=ko. The file
     stays so old links, decks and search results keep working.

     canonical is what stops this counting as duplicate content: it tells search
     engines the real address is the one below, not this filename. A meta refresh
     returns HTTP 200 rather than 301, so canonical is doing the work a server
     redirect would otherwise do. -->
<link rel="canonical" href="./?lang=ko">
<meta name="robots" content="noindex, follow">

<!-- Fallback for anything with JavaScript disabled. 0 seconds so it is
     effectively immediate. The script below runs first and preserves the
     #anchor, which a meta refresh cannot carry. -->
<meta http-equiv="refresh" content="0; url=./?lang=ko">

<script>
(function () {
  // Keep a deep link intact: ja-jp.html#cl-mirae should still land on Mirae.
  // An explicit ?lang= in the URL wins over the one this filename implies.
  var search = /[?&]lang=/.test(location.search) ? location.search : '?lang=ko';
  location.replace('./' + search + (location.hash || ''));
})();
</script>

<style>
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    background: #08062a; color: #fff;
    font-family: Arial, Helvetica, sans-serif; font-size: .9375rem;
  }
  a { color: #0092bc; }
</style>
</head>
<body>
  <p>Redirecting to <a href="./?lang=ko">Blueprint of Tomorrow (한국어)</a>&hellip;</p>
</body>
</html>
